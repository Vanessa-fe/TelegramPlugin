# fly.bot.toml - Telegram Bot (long polling)
# Deploy with: fly deploy --config fly.bot.toml

app = 'sublynk-bot'
primary_region = 'fra'

[build]
  dockerfile = 'packages/bot/Dockerfile'

[env]
  NODE_ENV = 'production'

# No HTTP service - this is a worker process
# Long polling requires exactly 1 instance running 24/7

[[vm]]
  memory = '256mb'
  cpus = 1

[processes]
  app = "node packages/bot/dist/main.js"

# Keep exactly 1 machine running at all times
# auto_stop MUST be disabled for long polling
[[machines]]
  auto_destroy = false

[deploy]
  strategy = 'rolling'
