# fly.prod.toml - configuration for the new production API app
app = 'sublynk-api'
primary_region = 'fra'

[build]
  dockerfile = 'packages/api/Dockerfile'

[deploy]
   release_command = 'pnpm --filter api prisma:deploy'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  CHANNEL_ACCESS_QUEUE_ENABLED = 'true'
  CHANNEL_ACCESS_QUEUE_METRICS_ENABLED = 'true'
  CHANNEL_ACCESS_QUEUE_METRICS_INTERVAL_MS = '600000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[services]
  min_machines_running = 1
